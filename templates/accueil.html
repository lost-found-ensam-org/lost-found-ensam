<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Accueil - Lost & Found ENSAM</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1><a href="/accueil">Lost & Found ENSAM Rabat</a></h1>
        <div class="user-badge">
            {{ user.prenom }} {{ user.nom }} | <a href="/" style="color: #edf2f7; text-decoration: underline;">Déconnexion</a>
        </div>
    </header>

    <div class="container" style="text-align: center;">
        <h2>Que souhaitez-vous signaler ?</h2>
        <p style="color: #718096; margin-top: 0.5rem;">Sélectionnez une option pour publier une annonce.</p>

        <div class="hub-grid">
            <a href="/perdu" class="hub-card card-perdu">
                J'ai perdu un objet
            </a>
            <a href="/trouve" class="hub-card card-trouve">
                J'ai trouvé un objet
            </a>
        </div>
    </div>
</body>
</html>
