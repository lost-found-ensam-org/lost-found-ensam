<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Objet Perdu - Lost & Found ENSAM</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header>
        <h1><a href="/accueil">Lost & Found ENSAM Rabat</a></h1>
        <a href="/accueil" style="color: white; text-decoration: none;">← Retour</a>
    </header>

    <div class="container">
        <h2 style="margin-bottom: 1.5rem;">Déclarer un objet perdu</h2>
        <form action="/accueil" method="get">
            <div class="form-group">
                <label for="nom_objet">Nom de l'objet</label>
                <input type="text" id="nom_objet" name="nom_objet" placeholder="Ex: Portefeuille noir" required>
            </div>
            <div class="form-group">
                <label for="categorie">Catégorie</label>
                <select id="categorie" name="categorie">
                    <option value="carte">Carte étudiante / Documents</option>
                    <option value="electronique">Téléphone / Chargeur / Écouteurs</option>
                    <option value="cles">Clés</option>
                    <option value="sac">Sac / Portefeuille</option>
                    <option value="vetement">Vêtement</option>
                    <option value="autre">Autre matériel</option>
                </select>
            </div>
            <div class="form-group">
                <label for="lieu">Lieu supposé de la perte</label>
                <input type="text" id="lieu" name="lieu" placeholder="Ex: Bibliothèque, Amphi A..." required>
            </div>
            <div class="form-group">
                <label for="date_perte">Date de la perte</label>
                <input type="date" id="date_perte" name="date_perte" required>
            </div>
            <div class="form-group">
                <label for="couleur">Couleur</label>
                <input type="text" id="couleur" name="couleur">
            </div>
            <div class="form-group">
                <label for="description">Description détaillée</label>
                <textarea id="description" name="description" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label for="photo">Photo (facultative)</label>
                <input type="file" id="photo" name="photo">
            </div>
            <button type="submit" class="btn-submit">Publier l'avis de recherche</button>
        </form>
    </div>
</body>
</html>
